name: Update horse data

on:
  schedule:
    # 18:00 every Friday in Asia/Tokyo.
    - cron: "0 9 * * 5"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: horse-data-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Scrape source data
        run: >
          python -m tools.horse_data.scrape_source
          --output ./data/source/workbook.json
          --site-metadata-output ./data/source/site_metadata.json
          --existing-source-json ./data/source/workbook.json
          --max-workers 8

      - name: Generate nonordinary ability data
        run: >
          python tools/nonordinary_data/generate_nonordinary_bundle.py
          --refresh
          --source-html ./data/nonordinary/raw/official_search/abilities.html
          --output ./json/nonordinary_abilities_bundle.json

      - name: Download R2 masters
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -m tools.horse_data.download_r2 --output "$RUNNER_TEMP/r2"

      - name: Update ID ledger and ability links
        run: |
          python -m tools.horse_data.id_ledger --r2-dir "$RUNNER_TEMP/r2"
          python -m tools.horse_data.ability_links --r2-dir "$RUNNER_TEMP/r2"

      - name: Commit weekly source data
        run: |
          if [ -z "$(git status --porcelain data/source data/nonordinary/raw/official_search/abilities.html json/nonordinary_abilities_bundle.json)" ]; then
            echo "No source data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source/workbook.json data/source/site_metadata.json data/source/id_ledger.json data/source/ability_links.json data/nonordinary/raw/official_search/abilities.html json/nonordinary_abilities_bundle.json
          git commit -m "Update official horse source and R2 links"
          git push origin HEAD:main

      - name: Generate using updated sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run generate-from-r2.yml --ref main
