name: Generate horse data from R2

on:
  schedule:
    - cron: "30 2 * * *" # 11:30 JST
  workflow_dispatch:
    inputs:
      as_of:
        description: "Publication date in JST (YYYY-MM-DD; empty means today)"
        required: false
        type: string
      dry_run:
        description: "Generate and test without committing"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: horse-data-main
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      # schedule のときは既定枝（main）が、手動実行のときは選んだ枝が checkout される。
      # 枝で試せるようにここでは固定しない。main へ push するのは下の条件で縛る。
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Download R2 masters
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -m tools.horse_data.download_r2 --output "$RUNNER_TEMP/r2"
      - name: Generate JSON data
        env:
          AS_OF: ${{ inputs.as_of }}
        run: |
          args=()
          if [ -n "$AS_OF" ]; then args+=(--as-of "$AS_OF"); fi
          python -m tools.horse_data.generate_horselist --r2-dir "$RUNNER_TEMP/r2" "${args[@]}"
      - name: Run Python tests
        run: python -m pytest
      - name: Run TypeScript tests
        run: npx tsx --test tests/*.test.ts
      - name: Build published site
        run: npm run build
        env:
          VITE_BASE_PATH: /dabimas-data/dist/
          VITE_DEPLOY_MODE: artifact-root
      - name: Commit generated data
        # 公開するのは main のコードで、dry_run でないときだけ。
        if: github.ref_name == 'main' && inputs.dry_run != true
        run: |
          if [ -z "$(git status --porcelain -- json/horselist.json json/factor.json dist)" ]; then
            echo "No generated data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add json/horselist.json json/factor.json dist
          git commit -m "Generate horse data from R2"
          git push origin HEAD:main
